<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>San Cayetano · Carta digital · ¡Calidad y buen sabor!</title>
<meta name="description" content="Carta digital de San Cayetano, comidas rápidas en el Mall La Cúpula. Hamburguesas, arepas rellenas, patacones, parrilla y menú típico. Armá tu pedido y envialo por WhatsApp.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="San Cayetano · ¡Calidad y buen sabor!">
<meta property="og:description" content="Mirá la carta, armá tu pedido y envialo por WhatsApp.">
<meta property="og:image" content="img/hero.webp">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0E0E;--slate:#161616;--card:#1B1B1B;--card2:#232323;--line:#2C2C2C;--line2:#3A3A3A;--gold:#F2C200;--gold2:#FFD84A;--ink:#141100;--txt:#FFFFFF;--soft:#DADADA;--mute:#ABABAB;--wa:#25D366;--waink:#062B13}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--slate) url(img/pizarra.webp) center top/700px auto repeat-y;position:relative;padding-bottom:110px}
.app::before{content:"";position:absolute;inset:0;background:rgba(14,14,14,.82);pointer-events:none}
.app>*{position:relative}
.hidden{display:none!important}
.cond{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em}

/* titulo con brocha, como en la carta */
.brush{display:inline-block;position:relative;padding:8px 26px 9px 22px;color:var(--ink);font-family:Anton,sans-serif;font-weight:400;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.03em;background:url(img/brocha.svg) center/100% 100% no-repeat}
.brush.lg{font-size:27px;padding:10px 30px 11px 24px}
.lede{margin:10px 0 0;color:var(--soft);font-size:14.5px}

/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(12,12,12,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px}
.top-logo img{height:44px;width:auto}
.cart-btn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:800;font-size:14px}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--ink);color:var(--gold);font-size:12px;font-weight:800;display:inline-grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);color:var(--soft);font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;background:rgba(0,0,0,.35)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* hero */
.hero{position:relative;min-height:600px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.hero>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,.05) 30%,rgba(10,10,10,.35) 55%,rgba(10,10,10,.97) 100%)}
.hero-in{position:relative;z-index:1;padding:20px 20px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.hero-logo{width:min(300px,78%);filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.tagline{font-family:Oswald,sans-serif;font-weight:600;font-size:20px;letter-spacing:.12em;color:var(--gold);margin-top:-4px}
.hero h1{margin:6px 0 0;font-family:Anton,sans-serif;font-weight:400;font-size:44px;line-height:.95;text-transform:uppercase}
.hero p{margin:0;color:var(--soft);font-size:15px;max-width:400px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-line{border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.3)}
.btn-wa{background:var(--wa);color:var(--waink)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

.sec{padding:40px 16px 6px}

/* guia */
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 18px}
.step{background:rgba(0,0,0,.45);border:1px solid var(--line2);border-radius:14px;padding:12px 10px;text-align:center}
.step b{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:Anton,sans-serif;font-weight:400;font-size:16px}
.step span{display:block;font-size:12.5px;font-weight:700;color:var(--soft);line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ccard{position:relative;aspect-ratio:1/1.12;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}
.ccard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.ccard:hover img{transform:scale(1.05)}
.ccard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.9) 100%)}
.ccard .tx{position:relative;z-index:1;padding:10px 10px 12px}
.ccard .brush{font-size:17px;padding:6px 18px 7px 14px}
.ccard .meta{display:block;margin:6px 0 0 4px;color:var(--soft);font-size:12px;font-weight:700}
.ccard.wide{grid-column:1/-1;aspect-ratio:2/1}

/* tarjetas grandes */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:18px}
.big{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.rail .big{flex:0 0 84%;scroll-snap-align:start}
.big .ph{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000}
.big .ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:999px;background:var(--gold);color:var(--ink);font-family:Oswald,sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.rank{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:Anton,sans-serif;font-size:18px}
.big .bd{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.big h3{margin:0;font-family:Anton,sans-serif;font-weight:400;font-size:28px;line-height:1;text-transform:uppercase}
.big p{margin:0;color:var(--mute);font-size:14px}
.big .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:#fff;color:#000;font-family:Oswald,sans-serif;font-weight:700;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.pill small{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#555;text-transform:uppercase}
.pill.lg{font-size:20px;padding:5px 14px}
.add{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:800;font-size:13.5px;white-space:nowrap}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--gold);border-radius:999px;padding:2px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--gold);font-size:20px;font-weight:800;display:grid;place-items:center}
.stepper span{min-width:26px;text-align:center;font-weight:800;color:var(--ink)}
.big .opts{display:flex;flex-direction:column;gap:10px}
.big .opt{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* promo y visita */
.promo{padding:20px;border-radius:20px;background:var(--gold);color:var(--ink)}
.promo h3{margin:6px 0 8px;font-family:Anton,sans-serif;font-weight:400;font-size:28px;line-height:1;text-transform:uppercase}
.promo p{margin:0 0 14px;font-size:14px;font-weight:600}
.visit{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.visit img{width:100%;height:220px;object-fit:cover}
.visit .bd{padding:18px;display:flex;flex-direction:column;gap:9px;color:var(--soft);font-size:14px}
.visit .ln{display:flex;gap:10px;align-items:center}
.quote{margin:28px 6px 0;text-align:center;font-family:Oswald,sans-serif;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.quote em{font-style:normal;color:var(--gold)}
.fine{text-align:center;color:#8C8C8C;font-size:12px;margin:14px 0 0}

/* vista categoria */
.banner{position:relative;height:280px;overflow:hidden;display:flex;align-items:flex-end}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(14,14,14,.98) 100%)}
.banner .tx{position:relative;z-index:1;padding:16px}
.banner .tx p{margin:8px 0 0 4px;color:var(--soft);font-size:14px;font-weight:600}
.carta{margin:8px 16px 0;padding:6px 16px;border-radius:20px;background:rgba(0,0,0,.55);border:1px solid var(--line2)}
.it{padding:16px 0;border-bottom:1px dashed var(--line2);display:flex;gap:12px}
.it:last-child{border-bottom:0}
.it .th{flex:0 0 74px;height:74px;border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
.it .th img{width:100%;height:100%;object-fit:cover}
.it .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.it .nm{display:flex;align-items:center;gap:8px;font-family:Oswald,sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.it .nm::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.it .mini{padding:2px 8px;border-radius:999px;background:rgba(242,194,0,.16);color:var(--gold2);font-family:Manrope,sans-serif;font-size:10px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.it p{margin:0;color:var(--mute);font-size:13px;line-height:1.4}
.it .opts{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.it .opt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.next-cat{margin:22px 16px 0;display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid var(--line2);color:var(--soft);font-weight:700}
.next-cat b{color:var(--gold)}

/* barra, aviso y hoja del carrito */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(536px,calc(100% - 24px));z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:0 18px;border-radius:18px;background:var(--gold);color:var(--ink);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.bar .l{display:flex;align-items:center;gap:10px;font-weight:800}
.bar .r{font-family:Anton,sans-serif;font-size:21px}
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:55;padding:12px 16px;border-radius:14px;background:#000;border:1px solid var(--gold);color:#fff;font-size:13.5px;font-weight:700;transition:all .25s ease;width:max-content;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;justify-content:center;align-items:flex-end}
.sheet-in{width:100%;max-width:560px;max-height:94vh;background:#121212;border-radius:24px 24px 0 0;border-top:2px solid var(--gold);display:flex;flex-direction:column}
.sheet-hd{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-hd .tt{display:flex;align-items:center;justify-content:space-between}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line2)}
.steps i.on{background:var(--gold)}
.steps-lb{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sheet-bd{padding:14px 18px;overflow-y:auto;flex:1}
.sheet-ft{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1;min-width:0}
.line .nm b{display:block;font-size:14.5px}
.line .nm span{color:var(--gold);font-size:13px;font-weight:700}
.line .stepper{background:transparent;border:1px solid var(--line2)}
.line .stepper button{background:transparent;color:#fff}
.line .stepper span{color:#fff}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 4px}
.tot b{font-family:Anton,sans-serif;font-size:28px;color:var(--gold);font-weight:400}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.field input,.field textarea{min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:#0A0A0A;color:#fff;font:inherit;font-size:15.5px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,194,0,.2)}
.field.err input{border-color:#ff6b5b}
.field .em{display:none;color:#ff8a7a;font-size:12.5px;font-weight:700}
.field.err .em{display:block}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{min-height:48px;border-radius:12px;border:1px solid var(--line2);font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:#2A2508;color:var(--gold2)}
.preview{white-space:pre-wrap;background:#0A0A0A;border:1px solid var(--line2);border-radius:14px;padding:14px;font-size:13.5px;line-height:1.55;color:var(--soft)}
.note{color:var(--mute);font-size:12.5px;margin:6px 0 0}
.done{text-align:center;padding:24px 6px}
.done h3{margin:10px 0 6px;font-family:Anton,sans-serif;font-weight:400;font-size:30px;text-transform:uppercase}
.ok{width:64px;height:64px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ccard img{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <a class="top-logo" href="#/" aria-label="San Cayetano, inicio"><img src="img/logo.png" alt="San Cayetano"></a>
      <button class="cart-btn" id="cartBtn" aria-label="Ver carrito">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M3 4h2l1 2"/></svg>
        Carrito <span class="badge" id="badge">0</span>
      </button>
    </div>
    <nav class="chips" id="chips" aria-label="Categorías"></nav>
  </header>
  <main id="view"></main>
</div>

<button class="bar hidden" id="bar" aria-label="Ver carrito">
  <span class="l"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/></svg><span id="barCount">0 productos</span></span>
  <span class="r">Ver carrito · <span id="barTotal">$0</span></span>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></div>

<script>
(function(){
var DATA=null, CART={}, STEP=1, FORM={nombre:'',entrega:'Domicilio',direccion:'',pago:'Efectivo',notas:''};
var PLUS='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
function fmt(n){return '$'+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function cat(id){return DATA.categorias.filter(function(c){return c.id===id;})[0];}
function keyOf(c,it,j){return c.id+'|'+it.n+'|'+j;}
function full(c,it){return (c.pre?c.pre+' ':'')+it.n;}
function parse(k){var p=k.split('|');var c=cat(p[0]);if(!c)return null;var it=c.items.filter(function(x){return x.n===p[1];})[0];if(!it)return null;var j=+p[2];if(it.p[j]==null)return null;return{c:c,it:it,j:j,price:it.p[j],name:full(c,it)+(c.labels?' ('+c.labels[j]+')':'')};}
function save(){try{localStorage.setItem('sc_cart',JSON.stringify(CART));localStorage.setItem('sc_form',JSON.stringify(FORM));}catch(e){}}
function load(){try{CART=JSON.parse(localStorage.getItem('sc_cart')||'{}')||{};var f=JSON.parse(localStorage.getItem('sc_form')||'null');if(f)FORM=Object.assign(FORM,f);}catch(e){CART={};}
  Object.keys(CART).forEach(function(k){if(!parse(k))delete CART[k];});}
function lines(){return Object.keys(CART).map(function(k){var x=parse(k);x.k=k;x.q=CART[k];x.sub=x.price*x.q;return x;});}
function totals(){var t=0,n=0;lines().forEach(function(l){t+=l.sub;n+=l.q;});return{t:t,n:n};}
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1600);}
function change(k,d,silent){var q=(CART[k]||0)+d;if(q<=0)delete CART[k];else CART[k]=q;save();refresh();if(d>0&&!silent){toast('Agregado al carrito: '+parse(k).name);}}
function qtyCtl(k){var q=CART[k]||0;
  if(!q)return '<button class="add" data-add="'+esc(k)+'">'+PLUS+'Agregar</button>';
  return '<span class="stepper"><button data-sub="'+esc(k)+'" aria-label="Quitar uno">−</button><span>'+q+'</span><button data-add="'+esc(k)+'" aria-label="Agregar otro">+</button></span>';}
function ctl(k){return '<span data-ctl="'+esc(k)+'">'+qtyCtl(k)+'</span>';}
function pill(c,j,p,lg){return '<span class="pill'+(lg?' lg':'')+'">'+(c.labels?'<small>'+esc(c.labels[j])+'</small>':'')+fmt(p)+'</span>';}
function opts(c,it,lg){return '<div class="opts">'+it.p.map(function(p,j){return '<div class="opt">'+pill(c,j,p,lg)+ctl(keyOf(c,it,j))+'</div>';}).join('')+'</div>';}
function minPrice(c){return Math.min.apply(null,c.items.map(function(i){return Math.min.apply(null,i.p);}));}
function maxP(it){return Math.max.apply(null,it.p);}
function wa(t){return 'https://wa.me/'+DATA.negocio.whatsapp+'?text='+encodeURIComponent(t);}
function bigCard(c,it,rank){var f=it.foto||c.foto;
  return '<article class="big"><div class="ph"><img src="'+f+'" alt="'+esc(full(c,it))+'" loading="lazy">'+(it.tag?'<span class="tag">'+esc(it.tag)+'</span>':'')+(rank?'<span class="rank">'+rank+'</span>':'')+'</div><div class="bd"><span class="cond" style="color:var(--gold);font-size:12px;font-weight:600">'+esc(c.nombre)+'</span><h3>'+esc(it.n)+'</h3>'+(it.d?'<p>'+esc(it.d)+'</p>':'')+'<div class="foot" style="display:block">'+opts(c,it,true)+'</div></div></article>';}

/* ---------- inicio ---------- */
function chips(active){$('chips').innerHTML='<a class="chip'+(active?'':' on')+'" href="#/">Inicio</a>'+DATA.categorias.map(function(c){return '<a class="chip'+(c.id===active?' on':'')+'" href="#/c/'+c.id+'">'+esc(c.nombre)+'</a>';}).join('');
  var on=$('chips').querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});}
function home(){
  chips(null);
  var N=DATA.negocio;
  var fav=[];DATA.categorias.forEach(function(c){c.items.forEach(function(it){if(it.tag)fav.push(bigCard(c,it));});});
  var g=DATA.categorias.map(function(c,i){
    return '<a class="ccard'+(i===0?' wide':'')+'" href="#/c/'+c.id+'"><img src="'+c.foto+'" alt="" loading="lazy"><span class="tx"><span class="brush">'+esc(c.nombre)+'</span><span class="meta">'+c.items.length+' opciones · desde '+fmt(minPrice(c))+'</span></span></a>';}).join('');
  $('view').innerHTML=
  '<section class="hero"><img class="bg" src="img/hero.webp" alt="Hamburguesa Cayetana con aros de cebolla, tocineta, queso y aguacate"><div class="hero-in"><img class="hero-logo" src="img/logo.png" alt="San Cayetano"><span class="tagline">¡CALIDAD Y BUEN SABOR!</span><h1>Sabor que te<br>hace volver</h1><p>Comidas rápidas en el '+esc(N.lugar)+'. Armá tu pedido aquí y te llega listo por WhatsApp.</p><div class="row"><a class="btn btn-gold" href="#carta">Ver la carta</a><a class="btn btn-line" href="#favoritos">Lo más pedido</a></div></div></section>'+
  '<section class="sec" id="carta" style="scroll-margin-top:110px"><span class="brush lg">Esto es lo que manejamos</span><p class="lede">Once categorías, más de setenta platos. Tocá una para ver primero lo mejor de la casa y después la lista completa.</p>'+
   '<div class="steps3"><div class="step"><b>1</b><span>Escogé la categoría</span></div><div class="step"><b>2</b><span>Agregá al carrito</span></div><div class="step"><b>3</b><span>Confirmá y enviá por WhatsApp</span></div></div>'+
   '<div class="grid">'+g+'</div></section>'+
  '<section class="sec" id="favoritos" style="scroll-margin-top:110px"><span class="brush lg">Los más pedidos</span><p class="lede">Los platos que más salen. Pedilos sin pensarlo.</p><div class="stack" style="margin-top:18px">'+fav.join('')+'</div></section>'+
  '<section class="sec"><span class="brush lg">Para el parche</span><article class="promo" style="margin-top:16px"><span class="cond" style="font-size:12px;font-weight:700">Combo pareja</span><h3>2 Cayetanas + papas mixtas</h3><p>Dos hamburguesas Cayetana con aros de cebolla y unas papas mixtas con salchicha y chorizo casero.</p><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-family:Anton,sans-serif;font-size:24px">[PRECIO PROMO]</span><a class="btn" style="background:var(--ink);color:var(--gold);min-height:46px" target="_blank" rel="noopener" href="'+wa('Hola San Cayetano, quiero el Combo pareja (2 Cayetanas + papas mixtas). ¿Qué precio tiene?')+'">La quiero</a></div></article></section>'+
  '<section class="sec" style="padding-bottom:24px"><div class="visit"><img src="img/cupula.webp" alt="Cúpula junto al Mall La Cúpula" loading="lazy"><div class="bd"><span class="brush" style="align-self:flex-start;font-size:18px">Visitanos</span><h2 style="margin:4px 0 0;font-family:Anton,sans-serif;font-weight:400;font-size:30px;color:#fff;text-transform:uppercase">'+esc(N.lugar)+'</h2><span class="ln">📍 '+esc(N.direccion)+'</span><span class="ln">🕑 '+esc(N.horario)+'</span><span class="ln">📞 Domicilios '+esc(N.telefonoDomicilios)+'</span><a class="btn btn-wa" style="margin-top:6px" target="_blank" rel="noopener" href="'+wa('Hola San Cayetano 👋')+'">Escribinos por WhatsApp</a></div></div>'+
   '<p class="quote">En nuestra cocina, <em>cocinamos recuerdos.</em><br>Disfrutá nuestra comida y creá momentos inolvidables con los tuyos.</p><p class="fine">'+esc(N.notaFotos||'')+' Precios en pesos colombianos.</p></section>';
}
/* ---------- categoria ---------- */
function category(id){
  var c=cat(id);if(!c){location.hash='#/';return;}
  chips(id);
  var idx=DATA.categorias.indexOf(c),nx=DATA.categorias[(idx+1)%DATA.categorias.length];
  var top=c.items.map(function(it,i){return{it:it,i:i};}).sort(function(a,b){return maxP(b.it)-maxP(a.it)||(b.it.foto?1:0)-(a.it.foto?1:0)||a.i-b.i;}).slice(0,Math.min(3,c.items.length));
  var tops=top.map(function(x,r){return bigCard(c,x.it,r+1);}).join('');
  var list=c.items.map(function(it){
    var th=it.foto?'<div class="th"><img src="'+it.foto+'" alt="'+esc(it.n)+'" loading="lazy"></div>':'';
    return '<div class="it">'+th+'<div class="bd"><span class="nm">'+esc(it.n)+(it.tag?'<span class="mini">'+esc(it.tag)+'</span>':'')+'</span>'+(it.d?'<p>'+esc(it.d)+'</p>':'')+opts(c,it,false)+'</div></div>';}).join('');
  $('view').innerHTML=
   '<div class="banner"><img src="'+c.foto+'" alt=""><div class="tx"><span class="brush lg">'+esc(c.nombre)+'</span><p>'+esc(c.lema)+' · '+c.items.length+' opciones · desde '+fmt(minPrice(c))+'</p></div></div>'+
   (c.items.length>3?'<section class="sec" style="padding-top:22px"><span class="brush">Lo mejor de la casa</span><p class="lede">Las opciones más completas de '+esc(c.nombre.toLowerCase())+'.</p><div class="rail" style="margin-top:14px">'+tops+'</div></section>':'')+
   '<section class="sec" style="padding-top:26px"><span class="brush">Toda la carta</span><p class="lede">'+(c.labels?'Cada plato viene en '+c.labels.join(' o ').toLowerCase()+': escogé el tuyo.':'Todos los platos de '+esc(c.nombre.toLowerCase())+', del más completo al clásico.')+'</p></section>'+
   '<div class="carta">'+list+'</div>'+
   '<a class="next-cat" href="#/c/'+nx.id+'"><span>Seguir con <b>'+esc(nx.nombre)+'</b></span><span aria-hidden="true">→</span></a>';
  window.scrollTo(0,0);
}
/* ---------- carrito ---------- */
function message(){var L=lines(),T=totals();
  return '*PEDIDO · SAN CAYETANO*\n\n'+
  L.map(function(l){return '• '+l.q+' x '+l.name+' — '+fmt(l.sub);}).join('\n')+
  '\n\n*Total productos: '+fmt(T.t)+'*'+(FORM.entrega==='Domicilio'?'\n(Valor del domicilio por confirmar)':'')+
  '\n\nCliente: '+FORM.nombre.trim()+
  '\nEntrega: '+FORM.entrega+(FORM.entrega==='Domicilio'?'\nDirección: '+FORM.direccion.trim():'')+
  '\nPago: '+FORM.pago+
  (FORM.notas.trim()?'\nNotas: '+FORM.notas.trim():'')+
  '\n\nQuedo atento a la confirmación. ¡Gracias!';}
function stepsHd(title){var labels=['Carrito','Tus datos','Confirmar'];
  return '<div class="sheet-hd"><div class="tt"><span class="brush" id="sheetTitle">'+title+'</span><button class="x" data-close aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
  (STEP<4?'<div class="steps">'+[1,2,3].map(function(s){return '<i class="'+(s<=STEP?'on':'')+'"></i>';}).join('')+'</div><div class="steps-lb">'+labels.map(function(l){return '<span>'+l+'</span>';}).join('')+'</div>':'')+'</div>';}
function renderSheet(){
  var L=lines(),T=totals(),h='';
  if(STEP===1){
    var body=L.length?L.map(function(l){return '<div class="line"><div class="nm"><b>'+esc(l.name)+'</b><span>'+fmt(l.price)+' c/u · '+fmt(l.sub)+'</span></div><span class="stepper"><button data-sub="'+esc(l.k)+'" aria-label="Quitar uno">−</button><span>'+l.q+'</span><button data-add="'+esc(l.k)+'" aria-label="Agregar otro">+</button></span></div>';}).join('')+'<div class="tot"><span>Total productos</span><b>'+fmt(T.t)+'</b></div><p class="note">El domicilio se cobra aparte y te lo confirman por WhatsApp.</p>'
      :'<div class="empty"><p style="font-size:16px;color:#fff;font-weight:700">Tu carrito está vacío</p><p>Agregá algo de la carta y aquí se va sumando.</p></div>';
    h=stepsHd('Tu carrito')+'<div class="sheet-bd">'+body+'</div><div class="sheet-ft">'+(L.length?'<button class="btn btn-gold" data-step="2">Continuar · '+fmt(T.t)+'</button>':'')+'<button class="btn btn-line" data-close>Seguir pidiendo</button></div>';
  }else if(STEP===2){
    var dom=FORM.entrega==='Domicilio';
    h=stepsHd('Tus datos')+'<div class="sheet-bd">'+
    '<label class="field" id="fNombre"><span>Tu nombre</span><input id="iNombre" autocomplete="name" placeholder="Ej. Juan Pérez" value="'+esc(FORM.nombre)+'"><span class="em">Escribí tu nombre.</span></label>'+
    '<div class="field"><span>¿Cómo lo querés?</span><div class="seg"><button data-set="entrega" data-v="Domicilio" aria-pressed="'+dom+'">Domicilio</button><button data-set="entrega" data-v="Recojo en el local" aria-pressed="'+!dom+'">Recojo en el local</button></div></div>'+
    (dom?'<label class="field" id="fDir"><span>Dirección y barrio</span><input id="iDir" autocomplete="street-address" placeholder="Calle, número, barrio o referencia" value="'+esc(FORM.direccion)+'"><span class="em">Necesitamos la dirección para el domicilio.</span></label>':'')+
    '<div class="field"><span>Forma de pago</span><div class="seg"><button data-set="pago" data-v="Efectivo" aria-pressed="'+(FORM.pago==='Efectivo')+'">Efectivo</button><button data-set="pago" data-v="Transferencia" aria-pressed="'+(FORM.pago==='Transferencia')+'">Transferencia</button></div></div>'+
    '<label class="field"><span>Notas para la cocina (opcional)</span><textarea id="iNotas" rows="2" placeholder="Sin cebolla, salsas aparte…">'+esc(FORM.notas)+'</textarea></label>'+
    '</div><div class="sheet-ft"><button class="btn btn-gold" data-step="3">Revisar pedido</button><button class="btn btn-line" data-step="1">Volver al carrito</button></div>';
  }else if(STEP===3){
    h=stepsHd('Confirmá')+'<div class="sheet-bd"><p class="note" style="margin:0 0 10px">Así le va a llegar tu pedido a San Cayetano:</p><div class="preview">'+esc(message())+'</div></div><div class="sheet-ft"><a class="btn btn-wa" id="sendWa" target="_blank" rel="noopener" href="'+wa(message())+'"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 .4C7.4.4.4 7.4.4 16c0 2.8.7 5.4 2 7.8L.3 31.6l8-2.1c2.3 1.2 4.9 1.9 7.7 1.9 8.6 0 15.6-7 15.6-15.6S24.6.4 16 .4zm0 28.4c-2.5 0-4.9-.7-7-1.9l-.5-.3-5 1.3 1.3-4.9-.3-.5C3.2 20.9 2.5 18.5 2.5 16 2.5 8.6 8.6 2.5 16 2.5S29.5 8.6 29.5 16 23.4 28.8 16 28.8z"/></svg>Confirmar y enviar por WhatsApp</a><button class="btn btn-line" data-step="2">Corregir datos</button></div>';
  }else{
    h=stepsHd('¡Listo!')+'<div class="sheet-bd"><div class="done"><span class="ok"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#141100" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span><h3>Pedido enviado</h3><p class="note" style="font-size:14px">Terminá de enviarlo en WhatsApp. San Cayetano te responde con el valor del domicilio y el tiempo de entrega.</p></div></div><div class="sheet-ft"><button class="btn btn-gold" data-new>Hacer otro pedido</button><button class="btn btn-line" data-step="3">Volver al resumen</button></div>';
  }
  $('sheetIn').innerHTML=h;
}
function openSheet(){STEP=1;renderSheet();$('sheet').classList.remove('hidden');document.body.style.overflow='hidden';}
function closeSheet(){$('sheet').classList.add('hidden');document.body.style.overflow='';}
function readForm(){var a=$('iNombre'),b=$('iDir'),c=$('iNotas');if(a)FORM.nombre=a.value;if(b)FORM.direccion=b.value;if(c)FORM.notas=c.value;save();}
function validate(){var ok=true;
  if(!FORM.nombre.trim()){$('fNombre').classList.add('err');ok=false;}
  if(FORM.entrega==='Domicilio'&&!FORM.direccion.trim()){$('fDir').classList.add('err');ok=false;}
  return ok;}
function refresh(){var T=totals();
  $('badge').textContent=T.n;
  $('bar').classList.toggle('hidden',!T.n);
  $('barCount').textContent=T.n+(T.n===1?' producto':' productos');$('barTotal').textContent=fmt(T.t);
  document.querySelectorAll('[data-ctl]').forEach(function(el){el.innerHTML=qtyCtl(el.getAttribute('data-ctl'));});
  if(!$('sheet').classList.contains('hidden')&&STEP===1)renderSheet();}

document.addEventListener('click',function(e){
  var t=e.target.closest('button,a');if(!t)return;
  var open=!$('sheet').classList.contains('hidden');
  if(t.hasAttribute('data-add')){change(t.getAttribute('data-add'),1,open);return;}
  if(t.hasAttribute('data-sub')){change(t.getAttribute('data-sub'),-1);return;}
  if(t.id==='cartBtn'||t.id==='bar'){openSheet();return;}
  if(t.hasAttribute('data-close')){readForm();closeSheet();return;}
  if(t.hasAttribute('data-set')){readForm();FORM[t.getAttribute('data-set')]=t.getAttribute('data-v');save();renderSheet();return;}
  if(t.hasAttribute('data-step')){var s=+t.getAttribute('data-step');readForm();
    if(s===3&&STEP===2&&!validate())return;
    STEP=s;renderSheet();$('sheetIn').querySelector('.sheet-bd').scrollTop=0;return;}
  if(t.id==='sendWa'){setTimeout(function(){STEP=4;renderSheet();},400);return;}
  if(t.hasAttribute('data-new')){CART={};FORM.notas='';save();refresh();closeSheet();location.hash='#/';return;}
});
document.addEventListener('input',function(e){var f=e.target.closest('.field');if(f)f.classList.remove('err');});
$('sheet').addEventListener('click',function(e){if(e.target===$('sheet')){readForm();closeSheet();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').classList.contains('hidden')){readForm();closeSheet();}});

function route(){var h=location.hash;
  if(h.indexOf('#/c/')===0)category(decodeURIComponent(h.slice(4)));
  else if(h==='#carta'||h==='#favoritos'){if(!$('carta'))home();setTimeout(function(){var m=document.querySelector(h);if(m)m.scrollIntoView();},0);}
  else{home();window.scrollTo(0,0);}
  refresh();}
window.addEventListener('hashchange',route);
fetch('menu.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(d){DATA=d;load();route();})
 .catch(function(){$('view').innerHTML='<p class="empty">No pudimos cargar la carta. Recargá la página.</p>';});
})();
</script>
</body>
</html>
